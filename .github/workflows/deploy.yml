name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# never run two deploys at once; a newer push supersedes a queued one
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the prebuilt static helium binary, shipped with the render function
      - name: Fetch helium
        run: scripts/fetch-helium.sh

      - name: Test
        run: |
          npm ci
          npm test

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          npx --yes netlify-cli@27.14.0 deploy --prod
          --dir=public --functions=netlify/functions
          --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME}"
