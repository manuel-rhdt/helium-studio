[build]
  publish = "public"
  # helium-bin/ is downloaded by scripts/fetch-helium.sh and deployed with the Netlify CLI (see
  # .github/workflows/deploy.yml), so Netlify's own build has nothing to do.
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["helium-bin/**"]

[[redirects]]
  from = "/api/render"
  to = "/.netlify/functions/render"
  status = 200
