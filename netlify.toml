[build]
  publish = "public"
  # helium-bin/ is built by GitHub Actions (scripts/build-helium.sh needs Docker) and deployed with
  # the Netlify CLI, so Netlify's own build has nothing to compile.
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["helium-bin/**"]

[[redirects]]
  from = "/api/render"
  to = "/.netlify/functions/render"
  status = 200
